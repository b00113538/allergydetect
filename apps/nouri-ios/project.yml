# XcodeGen spec — run `xcodegen generate` to produce Nouri.xcodeproj.
name: Nouri
options:
  bundleIdPrefix: com.nouri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple team ID

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"

targets:
  Nouri:
    type: application
    platform: iOS
    sources:
      - path: Nouri
      - path: GoogleService-Info.plist
        optional: true
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
      - package: GRDB
        product: GRDB
    info:
      path: Nouri/Resources/Info.plist
      properties:
        CFBundleDisplayName: Nouri
        UILaunchScreen:
          UIColorName: NouriBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Nouri uses the camera to photograph your meals so it can identify likely ingredients.
        NSPhotoLibraryUsageDescription: Choose a meal photo from your library to log it.
        # Base URL of the Dine Code scan page (Firebase Hosting). Override per build config if needed.
        NouriDineCodeBaseURL: https://nouri-app.web.app/d/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nouri.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  NouriTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NouriTests]
    dependencies:
      - target: Nouri
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nouri:
    build:
      targets:
        Nouri: all
        NouriTests: [test]
    test:
      targets: [NouriTests]
