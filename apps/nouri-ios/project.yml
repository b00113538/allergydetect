# XcodeGen spec — run `xcodegen generate` to produce Nouri.xcodeproj.
name: Nouri
options:
  bundleIdPrefix: com.nouri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    # Overridden by the TestFlight workflow with the run number, so every upload is unique.
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple team ID

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"

targets:
  Nouri:
    type: application
    platform: iOS
    sources:
      - path: Nouri
    # GoogleService-Info.plist is per-environment and not committed. Copy it into the bundle only
    # when present; without it the app runs in demo mode (see AppEnvironment.isFirebaseConfigured).
    postCompileScripts:
      - name: Copy Firebase config (if present)
        script: |
          SRC="${PROJECT_DIR}/GoogleService-Info.plist"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DEST"
            echo "Bundled GoogleService-Info.plist"
          else
            rm -f "$DEST"
            echo "No GoogleService-Info.plist - building in demo mode"
          fi
        inputFiles: []
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
        basedOnDependencyAnalysis: false
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAppCheck
      - package: GRDB
        product: GRDB
    entitlements:
      path: Nouri/Resources/Nouri.entitlements
      properties:
        # Xcode re-signs with "production" automatically when exporting for TestFlight / App Store.
        aps-environment: development
        # App Attest for Firebase App Check. TestFlight / App Store builds always use the production
        # App Attest environment regardless of this value.
        com.apple.developer.devicecheck.appattest-environment: development
    info:
      path: Nouri/Resources/Info.plist
      properties:
        CFBundleDisplayName: Nouri
        UILaunchScreen:
          UIColorName: NouriBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Nouri uses the camera to photograph meals, skin reactions and allergy test reports.
        NSPhotoLibraryUsageDescription: Choose a photo of a meal, a skin reaction or a test report to log it.
        # Base URL of the Dine Code scan page (Firebase Hosting). Override per build config if needed.
        NouriDineCodeBaseURL: https://nouri-app.web.app/d/
        # App Review account (see AppStore/README.md). Filled from the NOURI_REVIEWER_EMAIL build setting.
        NouriReviewerEmail: $(NOURI_REVIEWER_EMAIL)
        # The APNs token is handed to FCM explicitly in AppDelegate (see PushService).
        FirebaseAppDelegateProxyEnabled: false
        # Only standard HTTPS/TLS is used, which is exempt — skips the export-compliance prompt on every upload.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.health-fitness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nouri.app
        # When signed in with this email, release builds offer "Load sample history" so App Review sees
        # populated insights. Empty = disabled. The TestFlight workflow sets it from the repo variable.
        NOURI_REVIEWER_EMAIL: ""
        # iPhone only for v1 (an iPad build would also need iPad screenshots and layouts).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The Firebase config copy script reads a file outside the declared inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"

  NouriTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NouriTests]
    dependencies:
      - target: Nouri
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # App Store screenshots (UI test). Kept out of the main scheme so regular CI stays fast.
  NouriUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NouriUITests]
    dependencies:
      - target: Nouri
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Nouri:
    build:
      targets:
        Nouri: all
        NouriTests: [test]
    test:
      targets: [NouriTests]
  NouriScreenshots:
    build:
      targets:
        Nouri: all
        NouriUITests: [test]
    test:
      targets: [NouriUITests]
