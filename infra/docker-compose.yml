version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: allergydetect
      POSTGRES_USER: ad_user
      POSTGRES_PASSWORD: ad_pass
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ad_user -d allergydetect"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ../services/api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://ad_user:ad_pass@postgres:5432/allergydetect
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      USDA_API_KEY: ${USDA_API_KEY}
      NUTRITIONIX_APP_ID: ${NUTRITIONIX_APP_ID}
      NUTRITIONIX_API_KEY: ${NUTRITIONIX_API_KEY}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["../services/api:/app"]

  worker:
    build: ../services/api
    command: celery -A tasks worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://ad_user:ad_pass@postgres:5432/allergydetect
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["../services/api:/app"]

  beat:
    build: ../services/api
    command: celery -A tasks beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://ad_user:ad_pass@postgres:5432/allergydetect
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["../services/api:/app"]

volumes:
  pgdata:
