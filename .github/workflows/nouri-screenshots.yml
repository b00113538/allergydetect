name: Nouri App Store screenshots

# Manual: Actions → "Nouri App Store screenshots" → Run workflow.
# Runs the AppStoreScreenshots UI test in demo mode on a 6.9" iPhone simulator (1320 × 2868, the size
# App Store Connect requires) with a clean 9:41 status bar, then publishes the PNGs to the
# `nouri-screenshots` branch and as a run artifact.

on:
  workflow_dispatch:
  # Also re-run whenever the screenshot test or this workflow changes.
  push:
    paths:
      - "apps/nouri-ios/NouriUITests/**"
      - ".github/workflows/nouri-screenshots.yml"

permissions:
  contents: write

concurrency:
  group: nouri-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture screenshots
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/nouri-ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: apps/nouri-ios/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('apps/nouri-ios/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Boot a 6.9" iPhone with a clean status bar
        id: sim
        run: |
          # Newest available "Pro Max" (6.9" on iPhone 16/17 Pro Max).
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          picks = [dev for rt in sorted(d, reverse=True) if "iOS" in rt for dev in d[rt] if "Pro Max" in dev["name"]]
          print(picks[0]["udid"])')
          xcrun simctl list devices available | grep "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --operatorName "" --batteryState charged --batteryLevel 100
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Capture
        env:
          TEST_RUNNER_NOURI_SCREENSHOT_DIR: ${{ github.workspace }}/apps/nouri-ios/screenshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project Nouri.xcodeproj \
            -scheme NouriScreenshots \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee screenshots.log | grep -E "error:|Test Case|Executed|\*\* (BUILD|TEST)"
          ls -la screenshots
          for f in screenshots/*.png; do sips -g pixelWidth -g pixelHeight "$f" | tail -2 | tr '\n' ' '; echo " $f"; done

      - name: Publish to the nouri-screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SRC="$PWD/screenshots"
          OUT="$RUNNER_TEMP/publish"
          rm -rf "$OUT" && mkdir -p "$OUT" && cd "$OUT"
          git init -q && git checkout -q -b nouri-screenshots
          cp "$SRC"/*.png .
          {
            echo "# Nouri App Store screenshots"
            echo
            echo "Generated by the *Nouri App Store screenshots* workflow from \`${GITHUB_SHA::7}\` on $(date -u +%Y-%m-%d)."
            echo "6.9\" iPhone, 1320 × 2868. Upload in this order in App Store Connect."
            echo
            for f in *.png; do echo "![${f%.png}](./$f)"; done
          } > README.md
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "App Store screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" nouri-screenshots
          echo "Screenshots: https://github.com/${GITHUB_REPOSITORY}/tree/nouri-screenshots" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: |
            apps/nouri-ios/screenshots/*.png
            apps/nouri-ios/screenshots.log
